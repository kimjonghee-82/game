<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>메트로 플래너 - 도시 건설 시뮬레이션</title>
<style>
:root{
  --bg:#14202b; --panel:#1f2f3d; --panel2:#283c4d; --line:#3a5266; --text:#e8eef3; --muted:#9fb3c4;
  --accent:#4fc3f7; --good:#66bb6a; --bad:#ef5350; --warn:#ffca28;
  --R:#4caf50; --C:#2196f3; --I:#ffc107;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;touch-action:none;user-select:none}
canvas#view{position:absolute;inset:0;display:block;cursor:crosshair}
button{font-family:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}

/* top bar */
#top{position:absolute;left:0;right:0;top:0;height:52px;background:rgba(20,32,43,.94);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:0 10px;z-index:20;overflow-x:auto;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px;white-space:nowrap;font-weight:bold}
.chip small{color:var(--muted);font-weight:normal}
#cityName{font-size:15px}
#money.neg{color:var(--bad)}
#rci{display:flex;align-items:center;gap:3px;height:40px;padding:3px 7px}
.rbar{width:12px;height:34px;position:relative;background:#0e171f;border-radius:2px}
.rbar i{position:absolute;left:0;right:0}
.rbar::after{content:'';position:absolute;left:-2px;right:-2px;top:50%;height:1px;background:#888}
.rbar b{position:absolute;bottom:-1px;left:0;right:0;text-align:center;font-size:9px;line-height:1}
#speeds{display:flex;gap:3px}
.sp{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px}
.sp.on{background:var(--accent);color:#08202d;border-color:var(--accent)}
.tbtn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;white-space:nowrap;font-size:13px}
.tbtn:hover{background:var(--panel2)}

/* toolbar */
#toolbar{position:absolute;left:8px;top:62px;bottom:60px;width:58px;display:flex;flex-direction:column;gap:5px;z-index:15;overflow-y:auto;scrollbar-width:none}
#toolbar::-webkit-scrollbar{display:none}
.cat{width:54px;min-height:48px;background:rgba(31,47,61,.95);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;line-height:1.1;padding:3px 0}
.cat span{font-size:10px;color:var(--muted)}
.cat.on{border-color:var(--accent);background:#21445a}
#sub{position:absolute;left:72px;top:62px;max-height:calc(100% - 130px);overflow-y:auto;width:240px;background:rgba(31,47,61,.97);border:1px solid var(--line);border-radius:12px;padding:6px;z-index:16}
.tool{display:flex;align-items:center;gap:8px;width:100%;background:none;border:1px solid transparent;border-radius:8px;padding:6px 8px;text-align:left}
.tool:hover{background:var(--panel2)}
.tool.on{border-color:var(--accent);background:#21445a}
.tool.locked{opacity:.4}
.tool .ic{font-size:20px;width:26px;text-align:center}
.tool .nm{flex:1;font-size:13px}
.tool .nm small{display:block;color:var(--muted);font-size:11px}
.tool .co{font-size:12px;color:var(--warn)}
.subhead{font-size:11px;color:var(--muted);padding:6px 8px 2px}

/* overlay bar */
#overlays{position:absolute;right:8px;top:62px;z-index:15;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
#ovBtn{font-size:13px}
#ovList{background:rgba(31,47,61,.97);border:1px solid var(--line);border-radius:10px;padding:5px;display:flex;flex-direction:column;gap:2px;min-width:120px}
#ovList button{background:none;border:none;text-align:left;padding:5px 8px;border-radius:6px;font-size:13px}
#ovList button.on{background:var(--accent);color:#08202d}
#legend{background:rgba(31,47,61,.95);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:11px}
#legend .grad{width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,hsl(120,75%,45%),hsl(60,85%,50%),hsl(0,80%,50%));margin:3px 0}

/* minimap */
#mini{position:absolute;right:8px;bottom:60px;width:132px;height:132px;border:1px solid var(--line);border-radius:8px;z-index:15;background:#0e171f;image-rendering:pixelated}

/* ticker */
#ticker{position:absolute;left:8px;right:150px;bottom:8px;height:42px;background:rgba(20,32,43,.94);border:1px solid var(--line);border-radius:10px;z-index:15;display:flex;align-items:center;gap:8px;padding:0 12px;overflow:hidden;font-size:13px}
#ticker .ad{font-size:20px}
#tickText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#tickText.warn{color:var(--warn)} #tickText.bad{color:#ff8a80} #tickText.good{color:#a5d6a7}
#approvalChip{position:absolute;right:8px;bottom:8px;width:132px;height:42px;z-index:15;justify-content:center}

/* tooltip */
#tip{position:absolute;z-index:30;pointer-events:none;background:rgba(10,18,25,.92);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;white-space:nowrap}

/* modal panel */
#modal{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
#panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(640px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#panel header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);font-size:17px;font-weight:bold}
#panel header button{background:none;border:none;font-size:22px;line-height:1}
#pbody{padding:14px 16px;overflow-y:auto}
.row{display:flex;align-items:center;gap:10px;margin:6px 0}
.row label{flex:0 0 120px;color:var(--muted)}
.row input[type=range]{flex:1;accent-color:var(--accent)}
.row .val{flex:0 0 52px;text-align:right;font-weight:bold}
h3{margin:14px 0 6px;font-size:14px;color:var(--accent)}
table.bt{width:100%;border-collapse:collapse;font-size:13px}
table.bt td{padding:3px 4px;border-bottom:1px solid #2c4253}
table.bt td:last-child{text-align:right;font-variant-numeric:tabular-nums}
table.bt tr.sum td{font-weight:bold;border-top:2px solid var(--line)}
.pos{color:var(--good)} .negc{color:var(--bad)}
.btn{background:var(--accent);color:#08202d;border:none;border-radius:8px;padding:8px 14px;font-weight:bold}
.btn.sec{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.4}
.ord{display:flex;gap:10px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:8px;margin:6px 0}
.ord input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent)}
.ord div{flex:1} .ord small{color:var(--muted);display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px solid #2c4253;padding:3px 0}
.kv span:first-child{color:var(--muted)}
canvas.chart{width:100%;height:160px;background:#16232e;border-radius:8px;display:block}
.legendrow{display:flex;gap:12px;font-size:12px;margin:4px 0;flex-wrap:wrap}
.legendrow i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
input[type=text]{background:#16232e;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:7px 9px;font-family:inherit;font-size:14px;width:100%}
select{background:#16232e;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px;font-family:inherit}
.help p{margin:6px 0;line-height:1.55}
#info{position:absolute;z-index:25;right:150px;top:62px;width:250px;background:rgba(31,47,61,.97);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px}
#info .t{font-weight:bold;font-size:15px;margin-bottom:6px;display:flex;justify-content:space-between}
#info .t button{background:none;border:none;font-size:18px}
.bar{height:6px;background:#0e171f;border-radius:3px;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%}

@media (max-width:700px){
  #top{height:48px;gap:6px}
  #toolbar{top:56px;width:50px;left:4px;bottom:100px}
  .cat{width:46px;min-height:44px;font-size:18px}
  #sub{left:56px;top:56px;width:min(240px,calc(100% - 64px))}
  #overlays{top:56px;right:4px}
  #mini{width:96px;height:96px;bottom:56px;right:4px}
  #ticker{left:4px;right:4px;bottom:4px}
  #approvalChip{display:none}
  #ticker{height:auto;min-height:42px;padding:5px 10px}
  #tickText{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:12px}
  #info{right:4px;left:auto;top:auto;bottom:56px;width:min(260px,calc(100% - 110px))}
}
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="top">
  <div class="chip" id="cityName">메트로 플래너</div>
  <div class="chip" id="date">2000년 1월</div>
  <div class="chip" id="money">₩ 0</div>
  <div class="chip"><small>인구</small><span id="pop">0</span></div>
  <div class="chip" id="rci" title="수요: 주거/상업/공업">
    <div class="rbar"><i id="dR"></i><b style="color:var(--R)">R</b></div>
    <div class="rbar"><i id="dC"></i><b style="color:var(--C)">C</b></div>
    <div class="rbar"><i id="dI"></i><b style="color:var(--I)">I</b></div>
  </div>
  <div id="speeds">
    <button class="sp" data-s="0">⏸</button>
    <button class="sp" data-s="1">▶</button>
    <button class="sp on" data-s="2">▶▶</button>
    <button class="sp" data-s="3">▶▶▶</button>
  </div>
  <button class="tbtn" id="bBudget">💰 예산</button>
  <button class="tbtn" id="bOrd">📜 조례</button>
  <button class="tbtn" id="bStats">📊 통계</button>
  <button class="tbtn" id="bMenu">☰ 메뉴</button>
</div>

<div id="toolbar"></div>
<div id="sub" class="hidden"></div>

<div id="overlays">
  <button class="tbtn" id="ovBtn">🗺️ 지도: 기본</button>
  <div id="ovList" class="hidden"></div>
  <div id="legend" class="hidden"></div>
</div>

<canvas id="mini" width="128" height="128"></canvas>
<div id="ticker"><span class="ad" id="tickIcon">📰</span><span id="tickText">메트로 플래너에 오신 것을 환영합니다.</span></div>
<div class="chip" id="approvalChip"><small>지지율</small><span id="approval">70%</span></div>
<div id="tip" class="hidden"></div>
<div id="info" class="hidden"></div>

<div id="modal" class="hidden"><div id="panel"><header><span id="ptitle"></span><button id="pclose">✕</button></header><div id="pbody"></div></div></div>

<script src="game.js"></script>
</body>
</html>
